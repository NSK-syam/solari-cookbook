[project]
name = "septic-sentinel"
version = "0.1.0"
description = "Agentic septic due-diligence workflow with cited evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "solari-browser==0.1.2",
  "solari-desktop==0.2.0",
  "solari-sandbox==0.2.0",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/septic_sentinel"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src/septic_sentinel",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires live external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
